<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WOD Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#040e22; --surface:#071428; --card:#0b1d3a; --border:#122d55;
  --accent:#2979ff; --accent2:#00b4ff; --text:#ffffff; --muted:#6a90bc;
  --code-bg:#020c1b; --user-bg:#0d2d60; --ai-bg:#071428;
  --success:#4ade80; --warn:#facc15; --danger:#ff4c6a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#2979ff,#00b4ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px #2979ff44;}
.hinfo h1{font-size:17px;font-weight:900;color:#fff;letter-spacing:.02em;}
.hinfo p{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px;}
.live-pill{margin-left:auto;background:#071f07;border:1px solid #1a5c1a;border-radius:20px;padding:4px 11px;font-size:10px;color:var(--success);font-weight:800;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.live-pill .ld{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);}

/* MESSAGES */
#messages{flex:1;overflow-y:auto;padding:18px 13px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
#messages::-webkit-scrollbar{width:3px;}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 20px;text-align:center;}
.wlogo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#2979ff18,#00b4ff18);border:1px solid #2979ff33;display:flex;align-items:center;justify-content:center;}
.welcome h2{font-size:34px;font-weight:900;background:linear-gradient(90deg,#2979ff,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15;}
.welcome p{font-size:13px;color:var(--muted);font-weight:600;max-width:260px;line-height:1.65;}
.wbadges{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.wbadge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:11px;color:var(--muted);font-weight:700;}

/* MSG ROWS */
.msg-row{display:flex;flex-direction:column;gap:5px;animation:fadeUp .2s ease;}
.msg-row.user{align-items:flex-end;}
.msg-row.ai{align-items:flex-start;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.bwrap{max-width:88%;position:relative;}
.msg-row.user .bwrap{max-width:82%;}

.bubble{padding:13px 16px;border-radius:18px;font-size:15px;font-weight:600;line-height:1.65;word-break:break-word;}
.bubble.user{background:var(--user-bg);border:1px solid #1a3d7a;border-bottom-right-radius:4px;}
.bubble.ai{background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px;}

/* CONTENT FORMATTING */
.h-xl{font-size:38px;font-weight:900;line-height:1.15;margin:4px 0 10px;display:block;background:linear-gradient(90deg,#fff,#7ab8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.h-lg{font-size:22px;font-weight:900;color:#fff;line-height:1.25;margin:10px 0 6px;display:block;}
.kw{font-weight:800;color:#7ab8ff;}
.rtxt{font-weight:600;font-size:15px;line-height:1.65;display:block;margin:3px 0;}
.rlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;margin:8px 0;}
.rlist li{display:flex;gap:9px;font-weight:600;font-size:15px;align-items:flex-start;}
.rlist li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent2);flex-shrink:0;margin-top:8px;}
.spacer{height:7px;display:block;}

/* CODE BLOCK */
.code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:13px;overflow:hidden;margin:10px 0;}
.code-hdr{background:#060f20;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.code-lang{font-size:11px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em;font-family:'Space Mono',monospace;}
.ccopy{background:var(--border);border:none;border-radius:7px;padding:5px 12px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;transition:background .2s;}
.ccopy:active{background:var(--accent);}
.ccopy.done{background:#1a5c1a;color:var(--success);}
pre{padding:14px;overflow-x:auto;font-size:12px;line-height:1.6;color:#89c4ff;white-space:pre-wrap;word-break:break-all;font-family:'Space Mono',monospace;}

/* SOURCES */
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.sbadge{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 6px;text-decoration:none;transition:border-color .15s;}
.sbadge:active{border-color:var(--accent);}
.sfav{width:14px;height:14px;border-radius:3px;background:var(--border);object-fit:cover;}
.sname{font-size:10px;font-weight:700;color:var(--muted);}

/* TYPING */
.tbubble{padding:14px 16px;background:var(--ai-bg);border:1px solid var(--border);border-radius:18px;border-bottom-left-radius:4px;display:flex;gap:5px;align-items:center;}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:tb 1.2s infinite;}
.tdot:nth-child(2){animation-delay:.2s;} .tdot:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* META ROW */
.mmeta{display:flex;align-items:center;gap:6px;padding:0 3px;}
.msg-row.user .mmeta{justify-content:flex-end;}
.mtime{font-size:10px;color:var(--muted);font-weight:700;font-family:'Space Mono',monospace;}
.mactions{display:flex;gap:4px;}
.abtn{width:27px;height:27px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;flex-shrink:0;}
.abtn:active{background:var(--border);}

/* DROPDOWN */
.dmenu{position:absolute;bottom:32px;right:0;background:#0d1f3c;border:1px solid var(--border);border-radius:13px;overflow:hidden;min-width:165px;z-index:100;box-shadow:0 8px 28px #00000077;display:none;}
.dmenu.open{display:block;animation:fadeUp .15s ease;}
.ditem{padding:11px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s;}
.ditem:active{background:var(--border);}
.ditem.dgood{color:var(--success);}
.ditem.dbad{color:var(--danger);}
.ditem+.ditem{border-top:1px solid var(--border);}

/* COPY RESPONSE BTN */
.crBtn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 12px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;transition:all .15s;}
.crBtn:active{border-color:var(--accent);color:#fff;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.crBtn.bl{animation:blink .4s ease 3;}

/* FREE PLAN TOAST */
#ftoast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#071428;border:1px solid #2979ff44;border-radius:13px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:0 4px 24px #00000066;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
#ftoast.show{opacity:1;}
.fspinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.ftag{background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:900;flex-shrink:0;}

/* INPUT */
#iarea{background:var(--surface);border-top:1px solid var(--border);padding:10px 12px 13px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
#uinput{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 14px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;resize:none;max-height:120px;outline:none;transition:border-color .2s;line-height:1.4;}
#uinput:focus{border-color:var(--accent);}
#uinput::placeholder{color:var(--muted);}
#uinput:disabled{opacity:.4;}
#sbtn{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#2979ff,#00b4ff);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s,transform .15s;box-shadow:0 4px 16px #2979ff44;}
#sbtn:active{transform:scale(.91);}
#sbtn:disabled{opacity:.35;cursor:not-allowed;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L2 7l10 5 10-5-10-5z" fill="white"/>
      <path d="M2 17l10 5 10-5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M2 12l10 5 10-5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="hinfo">
    <h1>WOD Assistant</h1>
    <p>World of Discoveries &middot; Henry Tallen &middot; Zambia</p>
  </div>
  <div class="live-pill"><div class="ld"></div>LIVE</div>
</header>

<div id="messages">
  <div class="welcome">
    <div class="wlogo">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#2979ff"/>
        <path d="M2 17l10 5 10-5" stroke="#00b4ff" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M2 12l10 5 10-5" stroke="#2979ff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>WOD Assistant</h2>
    <p>Sharp. Respectful. Web-connected.<br/>Built for you by World of Discoveries.</p>
    <div class="wbadges">
      <div class="wbadge">Web Search</div>
      <div class="wbadge">Code Ready</div>
      <div class="wbadge">Source Badges</div>
      <div class="wbadge">WOD &middot; Zambia</div>
    </div>

</div>

<div id="ftoast">
  <div class="fspinner"></div>
  <span class="ftag">WOD AI</span>
  <span>Free plan &mdash; processing, please wait&hellip;</span>
</div>

<div id="iarea">
  <textarea id="uinput" placeholder="Ask WOD Assistant anything..." rows="1"></textarea>
  <button id="sbtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M22 2L11 13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 2L15 22L11 13L2 9L22 2Z" fill="white"/>
    </svg>
  </button>
</div>

<script>
// === KEYS (obfuscated) ===
var _fa=atob('YXBmX2V6MjMx'),_fb=atob('azdvNGtnOGlj'),_fc=atob('ajNmaW1kc2Fkag==');
var LLMKEY=_fa+_fb+_fc;
var _sa=atob('MDBhYTgwOGZiNTg0OA=='),_sb=atob('NmYyNmY1ZGVjMDE4NTQ='),_sc=atob('ZmM5NGRmZTkyMjg2Yw==');
var SERPERKEY=_sa+_sb+_sc;

// === CONFIG ===
var LLM_TARGET='https://apifreellm.com/api/v1/chat';
var SERPER_URL='https://google.serper.dev/search';
var COOLDOWN=42000;

var LLM_PROXIES=[
  'https://api.allorigins.win/raw?url='+encodeURIComponent(LLM_TARGET),
  'https://corsproxy.io/?url='+encodeURIComponent(LLM_TARGET),
  'https://proxy.cors.sh/'+LLM_TARGET,
  LLM_TARGET
];

var SYSPROMPT=[
  "You are WOD Assistant, a powerful AI built by World of Discoveries (WOD), founded by Henry Tallen in Zambia.",
  "You are warm, intelligent, deeply respectful, and honest. Your three unbreakable pillars are:",
  "1. RESPECT — Honor every user with dignity and patience.",
  "2. SAFETY — Never provide harmful or misleading content.",
  "3. ALIGNMENT — Always act in the user's best interest.",
  "",
  "STYLE: Direct, clear, warm. Break complex things down simply. Sound human — never robotic.",
  "",
  "FORMATTING (strictly follow):",
  "- Main topic title: ## Title Here",
  "- Subheadings: ### Subheading",
  "- Important keywords: **wrap in double asterisks**",
  "- Bullet points: - item",
  "- Code: ```language ... ```",
  "",
  "CODING: Always explain code before showing it. Use code blocks. Keep code clean.",
  "WEB: When search results are given, use them for accurate, up-to-date answers.",
  "Never make up facts. Be honest if you don't know something."
].join('\n');

// === STATE ===
var activeLLM=-1, coolActive=false, msgN=0;

// === DOM ===
var msgsEl=document.getElementById('messages');
var inp=document.getElementById('uinput');
var sbtn=document.getElementById('sbtn');
var toast=document.getElementById('ftoast');

// Close dropdowns on outside tap
document.addEventListener('click',function(e){
  if(!e.target.closest('.abtn')) document.querySelectorAll('.dmenu.open').forEach(function(m){m.classList.remove('open');});
});

function ts(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function scrollB(){msgsEl.scrollTop=msgsEl.scrollHeight;}
function showToast(){toast.classList.add('show');}
function hideToast(){toast.classList.remove('show');}

// === RENDER AI RESPONSE ===
function renderResp(text){
  var frag=document.createDocumentFragment();
  var lines=text.split('\n');
  var i=0;
  while(i<lines.length){
    var ln=lines[i];
    // Code block
    if(ln.trimStart().startsWith('```')){
      var lang=ln.trim().replace('```','').trim()||'code';
      var code=[];
      i++;
      while(i<lines.length&&!lines[i].trimStart().startsWith('```')){code.push(lines[i]);i++;}
      var ct=code.join('\n');
      var cb=document.createElement('div');
      cb.className='code-block';
      var copyId='cc'+Math.random().toString(36).slice(2);
      cb.innerHTML='<div class="code-hdr"><span class="code-lang">'+esc(lang)+'</span>'
        +'<button class="ccopy" id="'+copyId+'" onclick="cpCode(\''+copyId+'\',\''+ea(ct)+'\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2"/></svg> Copy</button></div>'
        +'<pre>'+esc(ct)+'</pre>';
      frag.appendChild(cb); i++; continue;
    }
    // ## XL heading
    if(/^## /.test(ln)){
      var s=document.createElement('span');s.className='h-xl';s.textContent=ln.replace(/^## /,'');
      frag.appendChild(s); i++; continue;
    }
    // ### heading
    if(/^### /.test(ln)){
      var s=document.createElement('span');s.className='h-lg';s.textContent=ln.replace(/^### /,'');
      frag.appendChild(s); i++; continue;
    }
    // Bullet list
    if(/^- /.test(ln.trimStart())){
      var ul=document.createElement('ul');ul.className='rlist';
      while(i<lines.length&&/^- /.test(lines[i].trimStart())){
        var li=document.createElement('li');
        li.appendChild(inlineParse(lines[i].replace(/^[\s]*- /,'')));
        ul.appendChild(li); i++;
      }
      frag.appendChild(ul); continue;
    }
    // Empty line
    if(ln.trim()===''){
      var sp=document.createElement('span');sp.className='spacer';
      frag.appendChild(sp); i++; continue;
    }
    // Normal text
    var p=document.createElement('span');p.className='rtxt';
    p.appendChild(inlineParse(ln));
    frag.appendChild(p); i++;
  }
  return frag;
}

function inlineParse(text){
  var wrap=document.createElement('span');
  var parts=text.split(/(\*\*[^*]+\*\*)/g);
  parts.forEach(function(pt){
    if(/^\*\*.*\*\*$/.test(pt)){
      var kw=document.createElement('strong');kw.className='kw';kw.textContent=pt.replace(/\*\*/g,'');
      wrap.appendChild(kw);
    } else { wrap.appendChild(document.createTextNode(pt)); }
  });
  return wrap;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ea(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');}

function cpCode(btnId,code){
  var real=code.replace(/\\n/g,'\n').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
  navigator.clipboard.writeText(real).then(function(){
    var b=document.getElementById(btnId);
    if(!b)return;
    b.textContent='Copied!';b.classList.add('done');
    setTimeout(function(){
      b.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2"/></svg> Copy';
      b.classList.remove('done');
    },2000);
  });
}

// === ADD USER MESSAGE ===
function addUserMsg(text){
  var w=msgsEl.querySelector('.welcome');if(w)w.remove();
  var id='m'+(++msgN);
  var row=document.createElement('div');row.className='msg-row user';row.id=id;
  var bw=document.createElement('div');bw.className='bwrap';
  var bub=document.createElement('div');bub.className='bubble user';bub.textContent=text;
  bw.appendChild(bub);

  // meta
  var meta=document.createElement('div');meta.className='mmeta';
  var tm=document.createElement('span');tm.className='mtime';tm.textContent=ts();
  var acts=document.createElement('div');acts.className='mactions';
  var db=mkDotBtn([
    {icon:cpIcon(),label:'Copy',fn:function(el){cpItem(text,el);}},
    {icon:resendIcon(),label:'Resend',fn:function(){resend(text);}},
    {icon:editIcon(),label:'Edit',fn:function(){editMsg(id,text);}}
  ]);
  acts.appendChild(db);
  meta.appendChild(tm);meta.appendChild(acts);
  row.appendChild(bw);row.appendChild(meta);
  msgsEl.appendChild(row);scrollB();
  return id;
}

// === ADD AI MESSAGE ===
function addAIMsg(frag, sources, rawText){
  var id='m'+(++msgN);
  var row=document.createElement('div');row.className='msg-row ai';row.id=id;
  var bw=document.createElement('div');bw.className='bwrap';
  var bub=document.createElement('div');bub.className='bubble ai';
  bub.appendChild(frag);

  // Sources
  if(sources&&sources.length){
    var sd=document.createElement('div');sd.className='sources';
    sources.slice(0,5).forEach(function(s){
      var a=document.createElement('a');a.className='sbadge';a.href=s.link||'#';a.target='_blank';
      var dom='';try{dom=new URL(s.link).hostname.replace('www.','');}catch(e){dom=s.title||'source';}
      a.innerHTML='<img class="sfav" src="https://www.google.com/s2/favicons?domain='+dom+'&sz=32" onerror="this.style.display=\'none\'"/>'
        +'<span class="sname">'+esc(dom)+'</span>';
      sd.appendChild(a);
    });
    bub.appendChild(sd);
  }
  bw.appendChild(bub);

  // meta
  var meta=document.createElement('div');meta.className='mmeta';
  var tm=document.createElement('span');tm.className='mtime';tm.textContent=ts();

  // copy full response btn
  var crb=document.createElement('button');crb.className='crBtn';
  crb.innerHTML=cpIcon()+' Copy';
  crb.addEventListener('click',function(){
    navigator.clipboard.writeText(rawText).then(function(){
      crb.textContent='Copying...';crb.classList.add('bl');
      setTimeout(function(){crb.innerHTML=cpIcon()+' Copy';crb.classList.remove('bl');},2000);
    });
  });

  var db=mkDotBtn([
    {icon:cpIcon(),label:'Copy',fn:function(el){cpItem(rawText,el);}},
    {icon:goodIcon(),label:'Good response',cls:'dgood',fn:function(el){markR(el,'good');}},
    {icon:badIcon(),label:'Bad response',cls:'dbad',fn:function(el){markR(el,'bad');}}
  ]);

  var acts=document.createElement('div');acts.className='mactions';
  acts.appendChild(crb);acts.appendChild(db);
  meta.appendChild(tm);meta.appendChild(acts);
  row.appendChild(bw);row.appendChild(meta);
  msgsEl.appendChild(row);scrollB();
  return id;
}

// === DOT BUTTON BUILDER ===
function mkDotBtn(items){
  var btn=document.createElement('div');btn.className='abtn';
  btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  var menu=document.createElement('div');menu.className='dmenu';
  items.forEach(function(item){
    var di=document.createElement('div');
    di.className='ditem'+(item.cls?' '+item.cls:'');
    di.innerHTML=item.icon+' '+item.label;
    di.addEventListener('click',function(e){e.stopPropagation();item.fn(di);menu.classList.remove('open');});
    menu.appendChild(di);
  });
  btn.appendChild(menu);
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    document.querySelectorAll('.dmenu.open').forEach(function(m){if(m!==menu)m.classList.remove('open');});
    menu.classList.toggle('open');
  });
  return btn;
}

// === ICON HELPERS ===

// === TYPING ===
function addTyping(){
  var w=msgsEl.querySelector('.welcome');if(w)w.remove();
  var row=document.createElement('div');row.id='typing';row.className='msg-row ai';
  var bw=document.createElement('div');bw.className='bwrap';

function rmTyping(){var t=document.getElementById('typing');if(t)t.remove();}

// === WEB SEARCH ===
function doSearch(query){
  var body=JSON.stringify({q:query,num:6});
  var headers={'Content-Type':'application/json','X-API-KEY':SERPERKEY};
  function tryS(urls,i){
    if(i>=urls.length)return Promise.resolve(null);
    return fetch(urls[i],{method:'POST',headers:headers,body:body})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&(d.organic||d.knowledgeGraph))return d;
        return tryS(urls,i+1);
      }).catch(function(){return tryS(urls,i+1);});
  }
  var proxies=[
    SERPER_URL,
    'https://corsproxy.io/?url='+encodeURIComponent(SERPER_URL),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(SERPER_URL)
  ];
  return tryS(proxies,0);
}

function buildCtx(data){
  if(!data)return'';
  var lines=['[WEB SEARCH RESULTS - use these for accuracy]'];
  if(data.knowledgeGraph){
    var kg=data.knowledgeGraph;
    if(kg.title||kg.description)lines.push('Fact: '+(kg.title||'')+' — '+(kg.description||''));
  }
  if(data.organic){
    data.organic.slice(0,5).forEach(function(r,i){
      lines.push((i+1)+'. '+r.title+': '+r.snippet+' ['+r.link+']');
    });
  }
  return lines.join('\n');
}

function getSources(data){
  if(!data||!data.organic)return[];
  return data.organic.slice(0,5).map(function(r){return{title:r.title,link:r.link};});
}

function wantsSearch(text){
  var t=text.toLowerCase();
  var words=['what','who','when','where','how','why','search','find','latest','news','today','current','price','best','top','is there','does','can','tell me','explain','define'];
  return words.some(function(w){return t.includes(w);})||text.length>18;
}

// === LLM CALL ===
function callLLM(msg){
  var hdrs={'Content-Type':'application/json','Authorization':'Bearer '+LLMKEY};
  var body=JSON.stringify({message:msg});
  function tryP(i){
    if(i>=LLM_PROXIES.length)return Promise.reject(new Error('All proxies failed'));
    return fetch(LLM_PROXIES[i],{method:'POST',headers:hdrs,body:body})
      .then(function(r){return r.text();})
      .then(function(raw){
        var d=JSON.parse(raw);
        if(d.response||d.success){activeLLM=i;return d;}
        return tryP(i+1);
      }).catch(function(){return tryP(i+1);});
  }
  if(activeLLM>=0){
    return fetch(LLM_PROXIES[activeLLM],{method:'POST',headers:hdrs,body:body})
      .then(function(r){return r.json();})
      .catch(function(){activeLLM=-1;return tryP(0);});
  }
  return tryP(0);
}

// === COOLDOWN (hidden — just disables input, shows toast) ===
function startCooldown(){
  coolActive=true;sbtn.disabled=true;inp.disabled=true;showToast();
  setTimeout(function(){
    coolActive=false;sbtn.disabled=false;inp.disabled=false;hideToast();inp.focus();
  },COOLDOWN);
}

// === MAIN SEND ===
function sendMsg(){
  var text=inp.value.trim();
  if(!text||coolActive)return;
  addUserMsg(text);
  inp.value='';inp.style.height='auto';
  addTyping();showToast();
  sbtn.disabled=true;inp.disabled=true;

  var sp=wantsSearch(text)?doSearch(text):Promise.resolve(null);

  sp.then(function(sd){
    var ctx=buildCtx(sd);
    var srcs=getSources(sd);
    var fullMsg=SYSPROMPT+'\n\n'+(ctx?ctx+'\n\n':'')+'User: '+text;
    return callLLM(fullMsg).then(function(data){
      rmTyping();
      var raw=data.response||data.message||'No response.';
      var rendered=renderResp(raw);
      addAIMsg(rendered,srcs,raw);
    });
  }).catch(function(err){
    rmTyping();
    var ef=document.createDocumentFragment();
    var p=document.createElement('span');p.className='rtxt';p.style.color='#ff6584';
    p.textContent='Connection failed: '+err.message+'. Push to GitHub Pages and try from https://';
    ef.appendChild(p);
    addAIMsg(ef,[],err.message);
  }).then(function(){startCooldown();});
}

// === INPUT EVENTS ===
inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
sbtn.addEventListener('click',sendMsg);
